<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .box {
      position: relative;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 500px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .hud span { color: #f59e0b; }
    canvas {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-weight: 800;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #d97706; }
  </style>
</head>
<body>
  <div class="box">
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>HIGH SCORE: <span id="highVal">0</span></div>
    </div>
    <canvas id="canvas" width="500" height="240"></canvas>
    <div style="font-size: 12px; color: #64748b;">Space / Up Arrow to Jump · Down Arrow to Duck</div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 28px; font-weight: 800; color: #f59e0b;">DINO RUNNER</h2>
      <p style="color: #cbd5e1; font-size: 14px;">Sprint across prehistoric desert hazards!</p>
      <button class="btn" id="startBtn">START RUNNING</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 26px; font-weight: 800; color: #ef4444;">EXTINCT!</h2>
      <p style="font-size: 16px;">Score: <span id="finalScore" style="color: #f59e0b; font-weight: bold;">0</span></p>
      <button class="btn" id="restartBtn">RUN AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const highVal = document.getElementById('highVal');
    const finalScore = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let highScore = parseInt(localStorage.getItem('dino_high') || '0', 10);
    highVal.textContent = highScore;

    // Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.06) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.04, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    const GROUND_Y = 190;
    let dino = { x: 50, y: GROUND_Y - 40, w: 32, h: 40, vy: 0, jumping: false, ducking: false };
    let obstacles = [];
    let clouds = [{ x: 120, y: 50 }, { x: 350, y: 80 }];
    let speed = 4.5;
    let score = 0;
    let frame = 0;
    let isRunning = false;

    function resetGame() {
      dino = { x: 50, y: GROUND_Y - 40, w: 32, h: 40, vy: 0, jumping: false, ducking: false };
      obstacles = [];
      score = 0;
      frame = 0;
      speed = 4.5;
      scoreVal.textContent = 0;
      isRunning = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      loop();
    }

    function jump() {
      if (!isRunning) { resetGame(); return; }
      if (!dino.jumping) {
        dino.vy = -10.5;
        dino.jumping = true;
        playTone(380, 'square', 0.05);
      }
    }

    function update() {
      if (!isRunning) return;
      frame++;
      score = Math.floor(frame / 6);
      scoreVal.textContent = score;

      if (score > highScore) {
        highScore = score;
        highVal.textContent = highScore;
        localStorage.setItem('dino_high', highScore);
      }

      speed = 4.5 + Math.min(6, score * 0.004);

      // Dino physics
      if (dino.jumping) {
        dino.vy += 0.58; // Gravity
        dino.y += dino.vy;
        if (dino.y >= GROUND_Y - (dino.ducking ? 25 : 40)) {
          dino.y = GROUND_Y - (dino.ducking ? 25 : 40);
          dino.jumping = false;
          dino.vy = 0;
        }
      }

      // Height adjustment for ducking
      if (dino.ducking) {
        dino.h = 24;
        dino.w = 42;
        if (!dino.jumping) dino.y = GROUND_Y - 24;
      } else {
        dino.h = 40;
        dino.w = 32;
        if (!dino.jumping) dino.y = GROUND_Y - 40;
      }

      // Obstacle spawning
      if (frame % Math.floor(90 / (speed / 4.5) + Math.random() * 40) === 0) {
        const type = Math.random() < 0.3 ? 'bird' : 'cactus';
        if (type === 'cactus') {
          obstacles.push({ x: canvas.width, y: GROUND_Y - 36, w: 20, h: 36, type: 'cactus' });
        } else {
          // Bird flies at head height
          obstacles.push({ x: canvas.width, y: GROUND_Y - 46, w: 28, h: 20, type: 'bird' });
        }
      }

      // Obstacles update & collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= speed;

        // Collision check
        if (
          dino.x < ob.x + ob.w &&
          dino.x + dino.w > ob.x &&
          dino.y < ob.y + ob.h &&
          dino.y + dino.h > ob.y
        ) {
          return onGameOver();
        }

        if (ob.x + ob.w < 0) obstacles.splice(i, 1);
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= 0.8;
        if (c.x < -60) c.x = canvas.width + 20;
      });
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 16, c.y - 6, 18, 0, Math.PI * 2);
        ctx.arc(c.x + 32, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Ground bumps
      ctx.fillStyle = '#334155';
      for (let i = 0; i < 5; i++) {
        const bx = (frame * speed * 0.8 + i * 110) % canvas.width;
        ctx.fillRect(canvas.width - bx, GROUND_Y + 4, 12, 2);
      }

      // Dino
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.roundRect(dino.x, dino.y, dino.w, dino.h, 4);
      ctx.fill();
      // Eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dino.x + dino.w - 8, dino.y + 6, 4, 4);

      // Obstacles
      obstacles.forEach(ob => {
        if (ob.type === 'cactus') {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(ob.x + 6, ob.y, 8, ob.h);
          ctx.fillRect(ob.x, ob.y + 10, 6, 12);
          ctx.fillRect(ob.x + 14, ob.y + 14, 6, 10);
        } else {
          // Bird
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(ob.x, ob.y + 6, ob.w, 10);
          // Wing flap
          const flapOffset = (frame % 16 < 8) ? -8 : 8;
          ctx.fillRect(ob.x + 8, ob.y + 6 + flapOffset, 8, 6);
        }
      });
    }

    function onGameOver() {
      isRunning = false;
      playTone(160, 'sawtooth', 0.25);
      finalScore.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function loop() {
      if (!isRunning) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        dino.ducking = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') dino.ducking = false;
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);
    draw();
  </script>
</body>
</html>
