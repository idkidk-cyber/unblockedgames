<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 38px;
      font-weight: 800;
      color: #f59e0b;
      line-height: 1;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      text-align: center;
      min-width: 68px;
    }
    .score-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 18px;
      font-weight: 700;
      color: white;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
    }
    .btn {
      background: #d97706;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #b45309; }
    .grid-container {
      position: relative;
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      width: 360px;
      height: 360px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
    }
    .grid-cell {
      background: #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      transition: transform 0.1s ease-in-out;
    }
    /* Tile colors */
    .tile-2    { background: #475569; color: #f8fafc; }
    .tile-4    { background: #64748b; color: #f8fafc; }
    .tile-8    { background: #f59e0b; color: #fff; }
    .tile-16   { background: #ea580c; color: #fff; }
    .tile-32   { background: #dc2626; color: #fff; }
    .tile-64   { background: #e11d48; color: #fff; }
    .tile-128  { background: #eab308; color: #fff; font-size: 22px; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
    .tile-256  { background: #ca8a04; color: #fff; font-size: 22px; box-shadow: 0 0 14px rgba(202, 138, 4, 0.5); }
    .tile-512  { background: #10b981; color: #fff; font-size: 22px; box-shadow: 0 0 16px rgba(16, 185, 129, 0.6); }
    .tile-1024 { background: #06b6d4; color: #fff; font-size: 18px; box-shadow: 0 0 20px rgba(6, 182, 212, 0.7); }
    .tile-2048 { background: #8b5cf6; color: #fff; font-size: 18px; box-shadow: 0 0 25px rgba(139, 92, 246, 0.9); }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 10px;
    }
    .overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">SCORE</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">BEST</div>
          <div class="score-val" id="bestScore">0</div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <span>Join tiles to reach <strong>2048!</strong></span>
      <button class="btn" id="newGameBtn">New Game</button>
    </div>
    <div class="grid-container" id="grid">
      <!-- 16 cells -->
      <div id="gameOverlay" class="overlay hidden">
        <h2 id="overlayTitle" style="font-size: 28px; font-weight: 800;">Game Over!</h2>
        <button class="btn" id="retryBtn" style="padding: 10px 20px; font-size: 14px;">Try Again</button>
      </div>
    </div>
  </div>

  <script>
    const SIZE = 4;
    let board = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('bestScore').textContent = bestScore;

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('bestScore');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const newGameBtn = document.getElementById('newGameBtn');
    const retryBtn = document.getElementById('retryBtn');

    function initBoard() {
      board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      score = 0;
      updateScore(0);
      overlay.classList.add('hidden');
      spawnRandom();
      spawnRandom();
      render();
    }

    function spawnRandom() {
      const empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      gridEl.querySelectorAll('.grid-cell').forEach(el => el.remove());
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'grid-cell' + (val > 0 ? ` tile-${val}` : '');
          cell.textContent = val > 0 ? val : '';
          gridEl.appendChild(cell);
        }
      }
    }

    function updateScore(delta) {
      score += delta;
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('2048_best', bestScore);
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      let gained = 0;
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          gained += filtered[i];
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < SIZE) filtered.push(0);
      return { row: filtered, gained };
    }

    function rotateBoard() {
      const newBoard = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          newBoard[c][SIZE - 1 - r] = board[r][c];
        }
      }
      board = newBoard;
    }

    function moveLeft() {
      let moved = false;
      let totalGained = 0;
      for (let r = 0; r < SIZE; r++) {
        const { row, gained } = slide(board[r]);
        if (board[r].join(',') !== row.join(',')) moved = true;
        board[r] = row;
        totalGained += gained;
      }
      if (totalGained > 0) updateScore(totalGained);
      return moved;
    }

    function move(direction) {
      let moved = false;
      if (direction === 'left') {
        moved = moveLeft();
      } else if (direction === 'down') {
        rotateBoard();
        moved = moveLeft();
        rotateBoard(); rotateBoard(); rotateBoard();
      } else if (direction === 'right') {
        rotateBoard(); rotateBoard();
        moved = moveLeft();
        rotateBoard(); rotateBoard();
      } else if (direction === 'up') {
        rotateBoard(); rotateBoard(); rotateBoard();
        moved = moveLeft();
        rotateBoard();
      }

      if (moved) {
        spawnRandom();
        render();
        if (checkGameOver()) {
          overlayTitle.textContent = 'Game Over!';
          overlay.classList.remove('hidden');
        }
      }
    }

    function checkGameOver() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) return false;
          if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
          if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
        }
      }
      return true;
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') { e.preventDefault(); move('left'); }
      else if (key === 'arrowright' || key === 'd') { e.preventDefault(); move('right'); }
      else if (key === 'arrowup' || key === 'w') { e.preventDefault(); move('up'); }
      else if (key === 'arrowdown' || key === 's') { e.preventDefault(); move('down'); }
    });

    // Touch swipe support
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    newGameBtn.addEventListener('click', initBoard);
    retryBtn.addEventListener('click', initBoard);
    initBoard();
  </script>
</body>
</html>
