<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-panel {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #020617;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .lcd-counter {
      font-family: monospace;
      font-size: 22px;
      font-weight: 800;
      color: #ef4444;
      background: #000;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 50px;
      text-align: center;
    }
    .face-btn {
      background: #334155;
      border: none;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:hover { background: #475569; }
    .grid {
      display: grid;
      gap: 2px;
      background: #1e293b;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 30px;
      height: 30px;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.mine { background: #ef4444 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #22c55e; }
    .c-3 { color: #ef4444; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #f59e0b; }
    .c-6 { color: #06b6d4; }
    .c-7 { color: #f43f5e; }
    .c-8 { color: #ffffff; }

    .tools-bar {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: #94a3b8;
      align-items: center;
    }
    .toggle-flag-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toggle-flag-btn.active {
      background: #d97706;
      color: #fff;
      border-color: #f59e0b;
    }
    .diff-select {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-panel">
    <div class="header-bar">
      <div class="lcd-counter" id="mineCounter">010</div>
      <button class="face-btn" id="faceBtn">🙂</button>
      <div class="lcd-counter" id="timerCounter">000</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="tools-bar">
      <select id="diffSelect" class="diff-select">
        <option value="9">Beginner (9x9 - 10 mines)</option>
        <option value="12">Intermediate (12x12 - 20 mines)</option>
      </select>
      <button id="flagModeBtn" class="toggle-flag-btn">🚩 Flag Mode (Off)</button>
    </div>
  </div>

  <script>
    let rows = 9, cols = 9, mineCount = 10;
    let grid = [];
    let isGameOver = false;
    let isWon = false;
    let timer = 0;
    let timerInterval = null;
    let firstClick = true;
    let flagMode = false;
    let remainingFlags = 10;

    const gridEl = document.getElementById('grid');
    const mineCounter = document.getElementById('mineCounter');
    const timerCounter = document.getElementById('timerCounter');
    const faceBtn = document.getElementById('faceBtn');
    const diffSelect = document.getElementById('diffSelect');
    const flagModeBtn = document.getElementById('flagModeBtn');

    function initGame() {
      const size = parseInt(diffSelect.value, 10);
      rows = size;
      cols = size;
      mineCount = size === 9 ? 10 : 20;
      remainingFlags = mineCount;
      mineCounter.textContent = String(remainingFlags).padStart(3, '0');
      timer = 0;
      timerCounter.textContent = '000';
      clearInterval(timerInterval);
      timerInterval = null;
      isGameOver = false;
      isWon = false;
      firstClick = true;
      faceBtn.textContent = '🙂';

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
      gridEl.innerHTML = '';
      grid = [];

      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            neighborMines: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.addEventListener('click', () => onCellClick(r, c));
          cell.el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          gridEl.appendChild(cell.el);
          grid[r][c] = cell;
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < mineCount) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if ((r === safeR && c === safeC) || grid[r][c].isMine) continue;
        grid[r][c].isMine = true;
        planted++;
      }

      // Calculate neighbor counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].isMine) {
                count++;
              }
            }
          }
          grid[r][c].neighborMines = count;
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        timerCounter.textContent = String(Math.min(999, timer)).padStart(3, '0');
      }, 1000);
    }

    function toggleFlag(r, c) {
      if (isGameOver || isWon) return;
      const cell = grid[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';
      remainingFlags += cell.flagged ? -1 : 1;
      mineCounter.textContent = String(Math.max(0, remainingFlags)).padStart(3, '0');
    }

    function onCellClick(r, c) {
      if (isGameOver || isWon) return;
      if (flagMode) return toggleFlag(r, c);

      const cell = grid[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        startTimer();
      }

      if (cell.isMine) {
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        endGame(false);
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function reveal(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged || cell.isMine) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.neighborMines > 0) {
        cell.el.textContent = cell.neighborMines;
        cell.el.classList.add(`c-${cell.neighborMines}`);
      } else {
        // Cascade empty cells
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].isMine && !grid[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) {
        endGame(true);
      }
    }

    function endGame(won) {
      clearInterval(timerInterval);
      isGameOver = !won;
      isWon = won;
      faceBtn.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = grid[r][c];
          if (cell.isMine) {
            if (won) {
              cell.el.textContent = '🚩';
            } else if (!cell.el.classList.contains('mine')) {
              cell.el.textContent = '💣';
            }
          }
        }
      }
    }

    faceBtn.addEventListener('click', initGame);
    diffSelect.addEventListener('change', initGame);
    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagModeBtn.classList.toggle('active', flagMode);
      flagModeBtn.textContent = flagMode ? '🚩 Flag Mode (ON)' : '🚩 Flag Mode (Off)';
    });

    initGame();
  </script>
</body>
</html>
