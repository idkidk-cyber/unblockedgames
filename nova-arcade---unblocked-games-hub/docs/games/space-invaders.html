<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050811;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .arcade-cabinet {
      position: relative;
      background: #0b0f19;
      border: 2px solid #1e293b;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    canvas {
      background: #000;
      border: 1px solid #00ff66;
      display: block;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
    .btn:hover { background: #33ff88; }
  </style>
</head>
<body>
  <div class="arcade-cabinet">
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>WAVE: <span id="waveVal">1</span></div>
      <div>LIVES: <span id="livesVal">3</span></div>
    </div>
    <canvas id="canvas" width="480" height="420"></canvas>
    <div class="controls">
      <span>A/D or Arrows: Move</span>
      <span>Space: Fire Laser</span>
    </div>

    <div id="startOverlay" class="overlay">
      <h1 style="color: #00ff66; font-size: 28px;">SPACE DEFENDER</h1>
      <p style="color: #cbd5e1; text-align: center; font-size: 13px; max-width: 320px;">
        Defend Earth from invading alien squadrons! Eliminate all aliens before they reach ground level.
      </p>
      <button class="btn" id="startBtn">INSERT COIN / PLAY</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h1 id="overTitle" style="color: #ef4444; font-size: 28px;">GAME OVER</h1>
      <p style="color: #fff; font-size: 16px;">Final Score: <span id="finalScore">0</span></p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const waveVal = document.getElementById('waveVal');
    const livesVal = document.getElementById('livesVal');
    const finalScore = document.getElementById('finalScore');
    const overTitle = document.getElementById('overTitle');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'square', dur = 0.06) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.04, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let isRunning = false;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let player = { x: 220, y: 385, w: 26, h: 14, speed: 4.5 };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let enemyDir = 1;
    let enemySpeed = 1;
    let keys = {};

    function initEnemies() {
      enemies = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 50 + c * 48,
            y: 40 + r * 30,
            w: 24,
            h: 18,
            alive: true,
            type: r === 0 ? 'top' : (r < 2 ? 'mid' : 'bot')
          });
        }
      }
      enemySpeed = 0.9 + wave * 0.25;
      enemyDir = 1;
    }

    function initGame() {
      score = 0;
      lives = 3;
      wave = 1;
      bullets = [];
      enemyBullets = [];
      player.x = 220;
      scoreVal.textContent = 0;
      livesVal.textContent = 3;
      waveVal.textContent = 1;
      initEnemies();
      isRunning = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      loop();
    }

    function shoot() {
      if (!isRunning) return;
      if (bullets.length < 2) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 4, w: 4, h: 10, vy: -7 });
        playBeep(880, 'square', 0.05);
      }
    }

    function update() {
      if (!isRunning) return;

      // Player movement
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 10) player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w - 10) player.x += player.speed;

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Check enemy hit
        for (const e of enemies) {
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            bullets.splice(i, 1);
            score += e.type === 'top' ? 30 : (e.type === 'mid' ? 20 : 10);
            scoreVal.textContent = score;
            playBeep(320, 'noise', 0.08);
            break;
          }
        }
      }

      // Check win wave
      const remainingEnemies = enemies.filter(e => e.alive);
      if (remainingEnemies.length === 0) {
        wave++;
        waveVal.textContent = wave;
        initEnemies();
        return;
      }

      // Enemy movement
      let hitEdge = false;
      for (const e of remainingEnemies) {
        e.x += enemyDir * enemySpeed;
        if (e.x + e.w >= canvas.width - 15 || e.x <= 15) {
          hitEdge = true;
        }
        // Reached player level
        if (e.y + e.h >= player.y) {
          return gameOver(false);
        }
      }

      if (hitEdge) {
        enemyDir *= -1;
        for (const e of remainingEnemies) {
          e.y += 12;
        }
      }

      // Enemy firing
      if (Math.random() < 0.02 + wave * 0.005 && remainingEnemies.length > 0) {
        const shooter = remainingEnemies[Math.floor(Math.random() * remainingEnemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8, vy: 3 + wave * 0.3 });
      }

      // Enemy bullets update
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.vy;
        if (eb.y > canvas.height) {
          enemyBullets.splice(i, 1);
          continue;
        }

        // Check player hit
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
          enemyBullets.splice(i, 1);
          lives--;
          livesVal.textContent = lives;
          playBeep(150, 'sawtooth', 0.2);
          if (lives <= 0) {
            return gameOver(false);
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#334155';
      for (let i = 0; i < 20; i++) {
        ctx.fillRect((i * 47) % canvas.width, (i * 93) % canvas.height, 1, 1);
      }

      // Player
      ctx.fillStyle = '#00ff66';
      ctx.fillRect(player.x, player.y + 6, player.w, player.h - 6);
      ctx.fillRect(player.x + 8, player.y, 10, 6);
      ctx.fillRect(player.x + 11, player.y - 3, 4, 3);

      // Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemy bullets
      ctx.fillStyle = '#ef4444';
      enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

      // Enemies
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = e.type === 'top' ? '#ec4899' : (e.type === 'mid' ? '#eab308' : '#00ff66');
        // Retro alien shape
        ctx.fillRect(e.x + 4, e.y, e.w - 8, e.h);
        ctx.fillRect(e.x, e.y + 4, e.w, e.h - 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 5, e.y + 5, 3, 3);
        ctx.fillRect(e.x + e.w - 8, e.y + 5, 3, 3);
      });
    }

    function gameOver() {
      isRunning = false;
      finalScore.textContent = score;
      overTitle.textContent = 'GAME OVER';
      gameOverOverlay.classList.remove('hidden');
    }

    function loop() {
      if (!isRunning) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        shoot();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);
    draw();
  </script>
</body>
</html>
