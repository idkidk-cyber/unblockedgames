<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 400px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .hud span { color: #38bdf8; }
    canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      display: block;
    }
    .controls-hint {
      font-size: 12px;
      color: #94a3b8;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="game-container" style="position: relative;">
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>HIGH SCORE: <span id="highScoreVal">0</span></div>
      <div>SPEED: <span id="speedVal">1x</span></div>
    </div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls-hint">Use Arrow Keys or WASD · Space to Pause</div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 28px; color: #38bdf8;">RETRO SNAKE</h2>
      <p style="color: #94a3b8; font-size: 14px;">Eat apples, grow longer, don't hit walls or your tail!</p>
      <button class="btn" id="startBtn">START GAME</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 24px; color: #f43f5e;">GAME OVER</h2>
      <p style="font-size: 16px;">Final Score: <span id="finalScoreVal" style="color: #38bdf8; font-weight: bold;">0</span></p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const speedVal = document.getElementById('speedVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 15, y: 15 };
    let goldenFood = null;
    let goldenTimer = 0;
    let dx = 1;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    highScoreVal.textContent = highScore;
    let isRunning = false;
    let isPaused = false;
    let gameLoopTimeout = null;
    let baseSpeed = 110;

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      score = 0;
      goldenFood = null;
      scoreVal.textContent = score;
      speedVal.textContent = '1.0x';
      spawnFood();
      isRunning = true;
      isPaused = false;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      clearTimeout(gameLoopTimeout);
      loop();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }

      // 20% chance to spawn bonus golden apple
      if (Math.random() < 0.25 && !goldenFood) {
        let gValid = false;
        let gx = 0, gy = 0;
        while (!gValid) {
          gx = Math.floor(Math.random() * TILE_COUNT);
          gy = Math.floor(Math.random() * TILE_COUNT);
          gValid = !snake.some(s => s.x === gx && s.y === gy) && (gx !== food.x || gy !== food.y);
        }
        goldenFood = { x: gx, y: gy, life: 60 };
      }
    }

    function update() {
      if (!isRunning || isPaused) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Eat regular food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreVal.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        playBeep(520, 'triangle', 0.1);
        spawnFood();
      } else if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += 50;
        scoreVal.textContent = score;
        goldenFood = null;
        playBeep(880, 'sine', 0.15);
      } else {
        snake.pop();
      }

      if (goldenFood) {
        goldenFood.life--;
        if (goldenFood.life <= 0) goldenFood = null;
      }

      // Speed calculation
      const currentSpeedMultiplier = Math.min(2.5, 1 + Math.floor(score / 50) * 0.15);
      speedVal.textContent = currentSpeedMultiplier.toFixed(1) + 'x';
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Golden Food
      if (goldenFood) {
        ctx.fillStyle = goldenFood.life % 4 > 1 ? '#fbbf24' : '#f59e0b';
        ctx.beginPath();
        ctx.arc(goldenFood.x * GRID_SIZE + GRID_SIZE / 2, goldenFood.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#38bdf8'; // Head
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#0284c7' : '#0369a1';
        }
        ctx.fillRect(
          segment.x * GRID_SIZE + 1,
          segment.y * GRID_SIZE + 1,
          GRID_SIZE - 2,
          GRID_SIZE - 2
        );
      });
    }

    function loop() {
      if (!isRunning) return;
      update();
      draw();
      const currentDelay = Math.max(45, baseSpeed - Math.floor(score / 20) * 4);
      gameLoopTimeout = setTimeout(loop, currentDelay);
    }

    function gameOver() {
      isRunning = false;
      playBeep(180, 'sawtooth', 0.3);
      finalScoreVal.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
        initGame();
        return;
      }
      if (e.key === ' ') {
        isPaused = !isPaused;
        return;
      }

      const key = e.key.toLowerCase();
      if ((key === 'arrowup' || key === 'w') && dy !== 1) {
        dx = 0; dy = -1;
      } else if ((key === 'arrowdown' || key === 's') && dy !== -1) {
        dx = 0; dy = 1;
      } else if ((key === 'arrowleft' || key === 'a') && dx !== 1) {
        dx = -1; dy = 0;
      } else if ((key === 'arrowright' || key === 'd') && dx !== -1) {
        dx = 1; dy = 0;
      }
    });

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);
    draw();
  </script>
</body>
</html>
