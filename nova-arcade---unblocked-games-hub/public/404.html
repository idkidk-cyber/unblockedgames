<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Arcade - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 requests to index.html with appropriate path

    </script>
  </head>

    <p>Redirecting to arcade...</p>
  </body>
</html>
